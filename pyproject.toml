[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpipe"
version = "0.1.0"
description = "Find, enrich, AI-score and deliver B2B leads from OpenStreetMap."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
leadpipe = "leadpipe.cli:main"

[tool.setuptools.packages.find]
include = ["leadpipe*"]

[tool.setuptools.package-data]
leadpipe = ["niches/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
